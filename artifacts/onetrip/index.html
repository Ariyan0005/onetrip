<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>OneTripz — Compare & Book Cheap Flights, Hotels & Tours Worldwide</title>
    <meta name="description" content="Compare and book cheap flight tickets, budget hotels, holiday tours, and airport transfers worldwide with OneTripz." />
    <meta name="keywords" content="cheap flights, flight booking, compare airline tickets, cheap flight tickets, book flights online, air ticket price, international flights, domestic flights, last minute flights, best flight deals, airline tickets, hotel booking, holiday packages, airport transfers, travel tours, cheap airfare, OneTripz, flights from Dhaka, flights from London, flights from New York, flights from Dubai, flights to Bangkok, budget travel, low cost air travel" />
    <meta name="author" content="OneTripz" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- Canonical & Alternate Links -->
    <link rel="canonical" href="https://onetripz.com/" />
    <link rel="alternate" hreflang="x-default" href="https://onetripz.com/" />
    <link rel="alternate" hreflang="en" href="https://onetripz.com/" />
    <link rel="alternate" hreflang="bn" href="https://onetripz.com/" />

    <!-- Global & Local Geographic SEO -->
    <meta name="distribution" content="Global" />
    <meta name="coverage" content="Worldwide" />
    <meta name="rating" content="General" />
    <meta name="revisit-after" content="2 days" />
    <meta name="geo.region" content="GLOBAL" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OneTripz" />
    <meta property="og:url" content="https://onetripz.com/" />
    <meta property="og:title" content="OneTripz" />
    <meta property="og:description" content="Compare and book cheap flight tickets, budget hotels, holiday tours, and airport transfers worldwide with OneTripz." />
    <meta property="og:image" content="https://onetripz.com/onetrip-logo.png" />
    <meta property="og:image:alt" content="OneTripz - Live Flight & Hotel Search Comparison" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bn_BD" />
    <meta property="og:locale:alternate" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@onetripz" />
    <meta name="twitter:creator" content="@onetripz" />
    <meta name="twitter:url" content="https://onetripz.com/" />
    <meta name="twitter:title" content="OneTripz — Cheap Flights, Hotels & Travel Deals" />
    <meta name="twitter:description" content="Compare 500+ airlines, hotels, and tours in one place. Save more on every trip with OneTripz." />
    <meta name="twitter:image" content="https://onetripz.com/onetrip-logo.png" />
    <meta name="twitter:image:alt" content="OneTripz Travel Search Engine" />

    <link rel="icon" type="image/png" href="/onetrip-logo.png" data-onetrip-favicon />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Structured Data (Schema.org) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://onetripz.com/#website",
          "url": "https://onetripz.com/",
          "name": "OneTripz",
          "description": "Compare and book cheap flight tickets, budget hotels, holiday tours, and airport transfers worldwide.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://onetripz.com/#search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          },
          "inLanguage": ["en", "bn"]
        },
        {
          "@type": "TravelAgency",
          "@id": "https://onetripz.com/#organization",
          "name": "OneTripz",
          "url": "https://onetripz.com/",
          "logo": "https://onetripz.com/onetrip-logo.png",
          "image": "https://onetripz.com/onetrip-logo.png",
          "description": "Independent travel search and flight comparison engine aggregating live flight, hotel, and tour deals from trusted global booking providers.",
          "priceRange": "$$",
          "areaServed": "Worldwide",
          "serviceArea": {
            "@type": "Place",
            "name": "Worldwide"
          },
          "knowsAbout": ["Cheap Flights", "Airline Tickets", "Hotel Reservations", "Holiday Tours", "Airport Transfers"]
        },
        {
          "@type": "FAQPage",
          "@id": "https://onetripz.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "When is the best time to book cheap flight tickets?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Generally, booking 3 to 8 weeks before domestic flights and 2 to 4 months before international departures provides the most competitive airfares. Tuesdays and Wednesdays frequently offer lower rates compared to peak weekend travel days."
              }
            },
            {
              "@type": "Question",
              "name": "Does OneTripz charge any booking or transaction fees?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Never. OneTripz is 100% free for travelers. There are zero hidden fees, markups, or service charges. You compare real-time prices here and complete your reservation directly on verified airline or certified agency partner platforms."
              }
            },
            {
              "@type": "Question",
              "name": "How can I ensure there are no surprise fees on hotel bookings?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Always check whether local city taxes or resort fees are included in the checkout summary. We connect you with top global platforms that clearly state cancellation policies and breakdown taxes upfront before you pay."
              }
            },
            {
              "@type": "Question",
              "name": "Can I book hotels with free cancellation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Most partner properties provide flexible booking options with free cancellation up to 24 to 48 hours before check-in, giving you peace of mind if your itinerary changes."
              }
            },
            {
              "@type": "Question",
              "name": "Why should I pre-book an airport transfer or rental car?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Pre-booking airport transfers or car rentals guarantees a fixed upfront rate, eliminating long airport taxi queues, language barriers, and peak surge pricing when you arrive in an unfamiliar city."
              }
            },
            {
              "@type": "Question",
              "name": "Why is it better to book tour guides and attractions in advance?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Popular landmarks often enforce timed entry slots or sell out days in advance. Pre-booking secures your entry and usually includes skip-the-line privileges."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
