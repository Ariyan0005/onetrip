openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: widgets
    description: Public and admin travel widget operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /widgets:
    get:
      operationId: listPublishedWidgets
      tags: [widgets]
      summary: List published widgets
      responses:
        "200":
          description: Published widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TravelWidget"
        "503":
          description: Widget storage is not configured
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [widgets]
      summary: Check admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [widgets]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Authenticated
        "401":
          description: Invalid password
  /admin/logout:
    post:
      operationId: logoutAdmin
      tags: [widgets]
      summary: End an admin session
      responses:
        "200":
          description: Logged out
  /admin/widgets:
    get:
      operationId: listAdminWidgets
      tags: [widgets]
      summary: List all widgets for admins
      responses:
        "200":
          description: Widget library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TravelWidget"
        "401":
          description: Admin login required
    post:
      operationId: createAdminWidget
      tags: [widgets]
      summary: Create and publish a widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelWidgetInput"
      responses:
        "201":
          description: Created widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelWidget"
        "400":
          description: Invalid widget
        "401":
          description: Admin login required
  /admin/widgets/{id}:
    patch:
      operationId: updateAdminWidget
      tags: [widgets]
      summary: Update a widget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelWidgetInput"
      responses:
        "200":
          description: Updated widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelWidget"
        "401":
          description: Admin login required
        "404":
          description: Widget not found
    delete:
      operationId: deleteAdminWidget
      tags: [widgets]
      summary: Delete a widget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Admin login required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WidgetCategory:
      type: string
      enum: [flights, hotels, cars, bikes, tours, transfers, other]
    WidgetPlacement:
      type: string
      enum: [hero, after-destinations, before-faq, footer]
    TravelWidgetInput:
      type: object
      required: [title, provider, category, placement, code]
      properties:
        title:
          type: string
          maxLength: 160
        provider:
          type: string
          maxLength: 120
        category:
          $ref: "#/components/schemas/WidgetCategory"
        placement:
          $ref: "#/components/schemas/WidgetPlacement"
        code:
          type: string
          maxLength: 300000
        scriptUrl:
          type: string
        active:
          type: boolean
    TravelWidget:
      allOf:
        - $ref: "#/components/schemas/TravelWidgetInput"
        - type: object
          required: [id, updatedAt]
          properties:
            id:
              type: string
            updatedAt:
              type: string
              format: date-time
    AdminSession:
      type: object
      required: [authenticated, configured]
      properties:
        authenticated:
          type: boolean
        configured:
          type: boolean

